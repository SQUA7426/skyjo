name: skyjo
on:
 push:
   branches: [ main, dev1]
 pull_request:
   branches: [ main ]
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
   - uses: actions/checkout@v2
   - name: Set up JDK 11
     uses: actions/setup-java@v2
     with:
       java-version: '11'
       distribution: 'adopt'
   - name: compile
     run: sbt compile
   - name: run tests
     run:  sbt test
   - name: coverageReport
     run: sbt coverage test coverageReport
   - name: Report coverage to Coveralls
     run: sbt coveralls -repo-token ${{ secrets.GITHUB_TOKEN }}
